# Dedicated local test stack; never link to a hosted project.
# Production schema/configuration parity has not been verified.
project_id = "ohio-parent-hub-test"

[api]
enabled = true
port = 55431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55430
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[db.pooler]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 55434

[storage]
enabled = true
file_size_limit = "3MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = ["http://127.0.0.1:3100/auth/callback", "http://127.0.0.1:3100/auth/confirm"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"

[auth.email.smtp]
enabled = false

[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100

[analytics]
enabled = false

[edge_runtime]
enabled = false
