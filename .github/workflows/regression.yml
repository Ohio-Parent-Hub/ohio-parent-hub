name: Regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      # Use the CLI's official Docker Hub images; public ECR can exhaust its data quota.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and OS dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Start isolated database and fixtures
        run: npm run test:setup
      - name: Lint, TypeScript, unit tests, production build
        run: npm run verify
      - name: Local auth and database integration tests
        run: npm run test:integration
      - name: Desktop and mobile public browser tests
        run: npm run test:e2e
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove disposable database and credentials
        if: always()
        run: npm run test:teardown
